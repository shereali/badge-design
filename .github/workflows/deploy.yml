name: CI/CD Web Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ==========================================================
  # Stage 1: Detect Changes (Smart Path Filtering)
  # ==========================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - '**'
              - '!README.md'

  # ==========================================================
  # Stage 2: Frontend CI Quality Gate (Compile Dry-Run)
  # ==========================================================
  ci-frontend:
    name: Frontend CI & Compile Dry-Run
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Compile Test (Dry-Run Build)
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: npm run build

  # ==========================================================
  # Stage 3: Build & Push Image to GHCR (Zero VPS Compilation)
  # ==========================================================
  build-push:
    name: Build & Push Web Image
    needs: [changes, ci-frontend]
    if: always() && (needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Lowercase Image Base
        id: meta
        run: |
          echo "image_base=$(echo '${{ env.IMAGE_BASE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}/web:latest
            ${{ steps.meta.outputs.image_base }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ==========================================================
  # Stage 4: Zero-Load, Zero-Downtime VPS Deployment
  # ==========================================================
  deploy:
    name: Deploy to VPS
    needs: [changes, build-push]
    if: always() && (needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Secure SSH Deployment Key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::SSH Key secret is invalid or corrupted. Check VPS_SSH_KEY in repository secrets."
            exit 1
          }

          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test Server SSH Connectivity (Pre-Flight)
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ConnectTimeout=15 "$USER@$HOST" "echo Connected successfully as: \$(whoami)"

      - name: Sync Compose & Deploy Configurations
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" "mkdir -p /var/www/$USER/deploy"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new docker-compose.yml "$USER@$HOST:/var/www/$USER/"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new deploy/deploy.sh deploy/rollback.sh "$USER@$HOST:/var/www/$USER/deploy/"

      - name: Trigger Zero-Downtime Deployment on VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             REGISTRY='ghcr.io' \
             REPOSITORY_OWNER='$OWNER' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             bash /var/www/$USER/deploy/deploy.sh"

