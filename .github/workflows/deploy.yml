name: CI/CD Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ==========================================================
  # Stage 1: Detect Changes (Smart Path Filtering)
  # ==========================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      infra: ${{ steps.filter.outputs.infra }}
      any: ${{ steps.any.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            migrations:
              - 'backend/database/migrations/**'
            infra:
              - 'docker-compose*.yml'
              - 'deploy/**'
              - '.github/**'

      - name: Compute Execution Trigger
        id: any
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ steps.filter.outputs.backend }}" = "true" ] || \
             [ "${{ steps.filter.outputs.frontend }}" = "true" ] || \
             [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================
  # Stage 2: Parallel CI Quality Gates
  # ==========================================================
  ci-backend:
    name: Backend (Laravel CI)
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: pdo, pdo_mysql, mbstring, intl, gd, zip, bcmath, exif, pcntl

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Parallel PHP Syntax Check
        run: |
          find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  ci-frontend:
    name: Frontend (Nuxt 4 CI)
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Test (Dry-Run Build)
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          API_BASE_URL: "/api"
        run: npm run build

  # ==========================================================
  # Stage 3: Build & Push Images to GHCR
  # ==========================================================
  build-push:
    name: Build & Push Images
    if: always() && needs.changes.outputs.any == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Lowercase Image Base
        id: meta
        run: |
          echo "image_base=$(echo '${{ env.IMAGE_BASE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}/backend:latest
            ${{ steps.meta.outputs.image_base }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}/frontend:latest
            ${{ steps.meta.outputs.image_base }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================================
  # Stage 4: Zero-Load, Zero-Downtime VPS Deployment
  # ==========================================================
  deploy:
    name: Deploy to VPS
    if: always() && needs.changes.outputs.any == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Modified Services & Migrations
        run: |
          SERVICES=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.changes.outputs.infra }}" = "true" ]; then
            SERVICES="backend frontend"
          else
            [ "${{ needs.changes.outputs.backend }}" = "true" ] && SERVICES="$SERVICES backend"
            [ "${{ needs.changes.outputs.frontend }}" = "true" ] && SERVICES="$SERVICES frontend"
          fi
          echo "SERVICES=$(echo $SERVICES | xargs)" >> "$GITHUB_ENV"

          if [ "${{ needs.changes.outputs.migrations }}" = "true" ]; then
            echo "RUN_MIGRATIONS=true" >> "$GITHUB_ENV"
          else
            echo "RUN_MIGRATIONS=true" >> "$GITHUB_ENV"
          fi

      - name: Configure Secure SSH Deployment Key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::SSH Key secret is invalid or corrupted. Check VPS_SSH_KEY in repository secrets."
            exit 1
          }

          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test Server SSH Connectivity (Pre-Flight)
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ConnectTimeout=15 "$USER@$HOST" "echo Connected successfully as: \$(whoami)"

      - name: Sync Compose & Deploy Configurations
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" "mkdir -p /var/www/$USER/deploy"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new docker-compose.yml "$USER@$HOST:/var/www/$USER/"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new deploy/deploy.sh deploy/rollback.sh "$USER@$HOST:/var/www/$USER/deploy/"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" "chmod +x /var/www/$USER/deploy/*.sh"

      - name: Trigger Zero-Downtime Deployment on VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "SERVICES='$SERVICES' \
             RUN_MIGRATIONS='$RUN_MIGRATIONS' \
             IMAGE_TAG='$IMAGE_TAG' \
             REGISTRY='ghcr.io' \
             REPOSITORY_OWNER='$OWNER' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             bash /var/www/$USER/deploy/deploy.sh"
