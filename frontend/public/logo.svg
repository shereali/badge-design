<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lanyardGrad" x1="38" y1="4" x2="62" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main ID Badge Body -->
  <rect x="12" y="10" width="76" height="82" rx="20" fill="url(#badgeGrad)" filter="url(#glow)" />
  
  <!-- Subtle Glass Border Overlay -->
  <rect x="12.5" y="10.5" width="75" height="81" rx="19.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />

  <!-- Lanyard Slot Cutout -->
  <rect x="36" y="16" width="28" height="6" rx="3" fill="url(#lanyardGrad)" opacity="0.6" />

  <!-- Stylized "P" Identity Monogram + Attendee Silhouette -->
  <!-- Vertical spine of P -->
  <rect x="28" y="30" width="9" height="48" rx="4.5" fill="url(#accentGrad)" />

  <!-- Top loop of P -->
  <path d="M37 30 H55 C64.3888 30 72 37.6112 72 47 C72 56.3888 64.3888 64 55 64 H37 V55 H54 C58.4183 55 62 51.4183 62 47 C62 42.5817 58.4183 39 54 39 H37 V30 Z" fill="url(#accentGrad)" />

  <!-- Attendee Avatar Inside P Loop -->
  <circle cx="51" cy="45" r="4.5" fill="#312e81" />
  <path d="M44 54 C44 50.5 47 49 51 49 C55 49 58 50.5 58 54 Z" fill="#312e81" />

  <!-- ID Data Lines (Smart Security Chip / Waves) -->
  <rect x="42" y="69" width="26" height="4" rx="2" fill="#e0e7ff" />
  <rect x="42" y="75" width="16" height="3" rx="1.5" fill="#a5f3fc" />

  <!-- Holographic Security Sparkle -->
  <path d="M72 26 L73.5 30.5 L78 32 L73.5 33.5 L72 38 L70.5 33.5 L66 32 L70.5 30.5 Z" fill="#fef08a" opacity="0.95" />
</svg>
