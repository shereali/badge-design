services:
  backend:
    image: ${IMAGE_BASE:-ghcr.io/${REPOSITORY_OWNER:-shereali}/badge-design}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-porichoyid}-backend-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-porichoyid}
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-porichoyid-db-1}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-porichoyid_db}
      - DB_USERNAME=${DB_USERNAME:-porichoyid_user}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - default
      - caddy_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${IMAGE_BASE:-ghcr.io/${REPOSITORY_OWNER:-shereali}/badge-design}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-porichoyid}-frontend-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - API_BASE_URL=/api
    networks:
      - default
      - caddy_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-porichoyid}-db-1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-porichoyid_db}
      MYSQL_USER: ${DB_USERNAME:-porichoyid_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - porichoyid-db-1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  backend_storage:

networks:
  default:
    driver: bridge
  caddy_net:
    external: true
